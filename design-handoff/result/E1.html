<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E1 진입 / 키 등록</title>
<link rel="stylesheet" href="./design.css">
</head>
<body>

<div class="spec">

  <div class="spec-head">
    <div class="eyebrow">E1 · 세 번째 안</div>
    <h1>진입 / 키 등록</h1>
    <p>왼쪽 대화, 오른쪽 화면. 이 도구의 본체는 대화이므로 E1 부터 같은 골격을 쓴다. 그 단계의 입력은 대화 안 인라인 카드로 얹고, 오른쪽은 언제나 지금 무엇이 만들어지는지 보여주는 자리다.</p>
    <nav class="spec-nav">
      <a href="./E1.html" class="on">E1 키 등록</a>
      <a href="./E1-v2.html">E1 두 번째 안</a>
      <a href="./E1-v1.html">E1 첫 안</a>
      <a href="./P1.html">P1 컨셉</a>
      <a href="./P2.html">P2 세부</a>
      <a href="./W1.html">W1 작업</a>
      <a href="./D1.html">D1 내려받기</a>
      <a href="./S1.html">S1 설정</a>
    </nav>
    <div class="themebar"></div>
  </div>

  <!-- ===================================================================
       상태 1. 기본 - 키 확인 전
       구조 변경: 상단 앱바 + .page 단일 단 → 대화 셸(.chatshell).
       왼쪽 .chatpane 은 W1 의 대화 패널과 같은 마크업(.msg .msg-role
       .msg-body)을 쓰고, 폼은 .msg-form 안에 현행 클래스명 그대로 들어간다.
       오른쪽 .canvas 는 W1 의 미리보기 자리와 같은 위치다.
       =================================================================== -->
  <figure class="spec-state">
    <figcaption><b>상태 1</b> 기본 - 키 확인 전에는 모델을 고를 수 없다</figcaption>
    <div class="spec-frame">
      <div class="chatshell">

        <div class="chatpane">
          <div class="chat-head">
            <span class="mark">T</span>
            <span class="name">스킨 만들기</span>
            <span class="spacer"></span>
            <span class="badge">1 / 5</span>
          </div>

          <div class="steprail" id="steps">
            <span class="on"><span class="num">1</span> 키</span>
            <span><span class="num">2</span> 컨셉</span>
            <span><span class="num">3</span> 세부</span>
            <span><span class="num">4</span> 작업</span>
            <span><span class="num">5</span> 내려받기</span>
          </div>

          <div class="chat-body" id="root">
            <div class="msg sys">
              <div class="msg-body">
                서버 없음 · 로그인 없음. 키는 이 브라우저를 벗어나 고른 제공자로만 갑니다.
              </div>
            </div>

            <div class="msg">
              <div class="msg-role">안내</div>
              <div class="msg-body">
                어떤 블로그인지 답하면 4안을 만들어 줍니다. 고른 뒤 대화로 고쳐서 내려받습니다.
                <div class="tiny dim" style="margin-top:8px">먼저 쓸 키를 등록하세요. 확인은 모델 목록을 받아오는 것이라 토큰이 들지 않습니다.</div>

                <div class="msg-form">
                  <div class="field">
                    <div class="field-label">제공자</div>
                    <div class="opts" id="providers">
                      <button type="button" class="opt sm on" data-provider="anthropic">Anthropic</button>
                      <button type="button" class="opt sm" data-provider="openai">OpenAI</button>
                      <button type="button" class="opt sm" data-provider="google">Google</button>
                    </div>
                  </div>

                  <div class="field">
                    <div class="field-label">API 키</div>
                    <div class="row" id="key-edit">
                      <input type="password" class="mono" id="key" style="flex:1 1 150px; min-width:0" autocomplete="off" spellcheck="false" placeholder="sk-ant-api03-...">
                      <button class="sm" id="key-show" type="button">보기</button>
                      <button class="sm" id="check">확인</button>
                    </div>
                    <div class="field-note" id="key-hint">
                      <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Anthropic Console 에서 발급</a>
                    </div>
                  </div>

                  <div class="field off" id="model-field">
                    <div class="field-label">모델</div>
                    <div class="small dim" id="model-off">키를 확인하면 쓸 수 있는 모델이 나옵니다</div>
                  </div>

                  <div class="field">
                    <div class="row">
                      <button class="sm switch" id="remember">off</button>
                      <span class="small">이 브라우저에 키 저장</span>
                    </div>
                    <div class="field-note">꺼 두면 새로고침할 때 다시 넣어야 합니다. 공용 기기라면 꺼 두세요.</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="chat-foot">
            <div class="composer">
              <input type="text" placeholder="키를 확인하면 대화를 시작합니다" disabled>
              <div class="row">
                <span class="tiny dim" id="foot-note">요금은 사용자 계정에서 결제됩니다</span>
                <span class="spacer"></span>
                <button class="primary" id="start" disabled>시작</button>
              </div>
            </div>
          </div>
        </div>

        <div class="canvas">
          <div class="canvas-head">
            <span class="badge">나오는 것</span>
            <span class="spacer"></span>
            <span>실제 렌더가 아니라 도식입니다</span>
          </div>
          <div class="canvas-body">
            <div class="grid-4">
              <div>
                <div class="shot">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-row">
                    <div class="shot-side">
                      <div class="avatar"></div>
                      <l class="xs"></l><l class="s"></l><l class="s"></l>
                      <div class="chips"><s></s><s></s><s></s></div>
                    </div>
                    <div class="shot-col">
                      <div class="item"><l class="t"></l><l></l><l class="s"></l></div>
                      <div class="item"><l class="t2"></l><l></l></div>
                      <div class="item"><l class="t"></l><l class="s"></l></div>
                    </div>
                  </div>
                </div>
                <div class="shot-caption"><b>표준</b> 사이드바와 목록</div>
              </div>
              <div>
                <div class="shot">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-col">
                    <div class="item"><l class="t"></l><l></l><l class="s"></l></div>
                    <div class="item"><l class="t2"></l><l></l><l class="s"></l></div>
                    <div class="item"><l class="t"></l><l></l></div>
                  </div>
                </div>
                <div class="shot-caption"><b>읽기 중심</b> 사이드바 없음</div>
              </div>
              <div>
                <div class="shot">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-row"><div class="cells"><u></u><u></u><u></u><u></u><u></u><u></u></div></div>
                </div>
                <div class="shot-caption"><b>그리드</b> 이미지 앞세움</div>
              </div>
              <div>
                <div class="shot dark">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-col">
                    <div class="rowline"><i></i><l class="t"></l></div>
                    <div class="rowline"><i></i><l class="t2"></l></div>
                    <div class="rowline"><i></i><l class="t"></l></div>
                    <div class="rowline"><i></i><l class="t2"></l></div>
                    <div class="rowline"><i></i><l class="t"></l></div>
                  </div>
                </div>
                <div class="shot-caption"><b>작업 로그</b> 날짜와 제목만</div>
              </div>
            </div>
            <p class="tiny dim" style="margin-top:12px">답에 맞춰 매번 다른 4안이 나옵니다</p>

            <div class="eyebrow" style="margin:32px 0 12px">흐름과 비용</div>
            <div class="flow">
              <div class="now"><div class="num">1</div><div class="what">키 등록</div><div class="cost">무료</div></div>
              <div><div class="num">2</div><div class="what">컨셉 4안</div><div class="cost">호출 1회</div></div>
              <div><div class="num">3</div><div class="what">세부 정하기</div><div class="cost">무료</div></div>
              <div><div class="num">4</div><div class="what">대화로 작업</div><div class="cost">지시마다</div></div>
              <div><div class="num">5</div><div class="what">ZIP 내려받기</div><div class="cost">무료</div></div>
            </div>

            <div class="card dashed" style="margin-top:24px">
              <ul class="list marked small">
                <li>이 페이지에는 서버가 없습니다. 키는 브라우저를 벗어나 고른 제공자로만 갑니다.</li>
                <li>만든 스킨은 파일로 내려받습니다. 어디에도 올라가지 않습니다.</li>
                <li>요금은 사용자 계정에서 결제됩니다.</li>
              </ul>
            </div>
          </div>
        </div>

      </div>
    </div>
    <p class="spec-note">왼쪽 400px 은 W1 의 대화 패널과 같은 자리·같은 마크업이다. 폼은 응답 말풍선 안 <span class="token">.msg-form</span> 으로 들어가므로 단계가 넘어가도 골격이 흔들리지 않는다. 오른쪽은 E1 에서 도식, P2 에서 세부 도식, W1 에서 미리보기, D1 에서 관리자 도식이 같은 자리에 온다.</p>
  </figure>

  <!-- =================== 상태 3. 확인됨 =================== -->
  <figure class="spec-state">
    <figcaption><b>상태 3</b> 확인됨 - 모델이 열리고 시작이 눌린다</figcaption>
    <div class="spec-frame">
      <div class="chatshell">

        <div class="chatpane">
          <div class="chat-head">
            <span class="mark">T</span>

            <span class="spacer"></span>

          </div>
          <div class="steprail">
            <span class="on"><span class="num">1</span> 키</span>
            <span><span class="num">2</span> 컨셉</span>
            <span><span class="num">3</span> 세부</span>
            <span><span class="num">4</span> 작업</span>
            <span><span class="num">5</span> 내려받기</span>
          </div>

          <div class="chat-body">
            <div class="msg user">
              <div class="msg-role">나</div>
              <div class="msg-body"><span class="token">sk-ant- ... 4f2a</span></div>
            </div>

            <div class="msg">
              <div class="msg-role">안내</div>
              <div class="msg-body">
                키를 확인했습니다. 쓸 모델을 고르세요.
                <div class="msg-form">
                  <div class="field">
                    <div class="row" id="key-locked">
                      <span class="badge ok" id="lock-badge">Anthropic</span>
                      <span class="token">... 4f2a</span>
                      <span class="spacer"></span>
                      <button class="sm" id="replace">교체</button>
                      <button class="sm danger" id="forget">지우기</button>
                    </div>
                    <div class="field-note" id="lock-note">이 브라우저에 저장됨 · 뒤 4자리만 표시합니다</div>
                  </div>

                  <div class="field" id="model-field">
                    <div class="field-label">모델 <span class="from-concept">추천</span></div>
                    <div id="rec">
                      <div class="card tight selected pick">
                        <div class="row">
                          <span class="card-title" style="font-size:var(--t-body)">Claude Opus 5</span>
                          <span class="spacer"></span>
                          <span class="tiny dim">4안 <span class="token">{비용}</span></span>
                        </div>
                        <div class="card-sub">결과가 가장 정확합니다</div>
                      </div>
                      <div class="card tight pick">
                        <div class="row">
                          <span class="card-title" style="font-size:var(--t-body)">Claude Sonnet 5</span>
                          <span class="spacer"></span>
                          <span class="tiny dim">4안 <span class="token">{비용}</span></span>
                        </div>
                        <div class="card-sub">더 싸고 빠릅니다</div>
                      </div>
                    </div>
                    <div class="row" style="margin-top:10px">
                      <button class="sm" id="pick-list">받아온 목록에서</button>
                      <button class="sm" id="pick-custom">직접 입력</button>
                    </div>
                    <div class="field-note" id="model-note">추천 밖 모델은 단가를 몰라 비용을 표시하지 못합니다</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="chat-foot">
            <div class="composer">
              <input type="text" placeholder="다음 화면에서 컨셉을 묻습니다">
              <div class="row">
                <span class="tiny dim">4안 생성에 <span class="token">{토큰}</span> 정도</span>
                <span class="spacer"></span>
                <button class="primary">시작</button>
              </div>
            </div>
          </div>
        </div>

        <div class="canvas">
          <div class="canvas-head">
            <span class="badge">나오는 것</span>
            <span class="spacer"></span>
            <span>모델 Claude Opus 5 · 쓴 토큰 0</span>
          </div>
          <div class="canvas-body">
            <div class="grid-4">
              <div>
                <div class="shot">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-row">
                    <div class="shot-side"><div class="avatar"></div><l class="xs"></l><l class="s"></l><l class="s"></l></div>
                    <div class="shot-col">
                      <div class="item"><l class="t"></l><l></l><l class="s"></l></div>
                      <div class="item"><l class="t2"></l><l></l></div>
                    </div>
                  </div>
                </div>
                <div class="shot-caption"><b>표준</b></div>
              </div>
              <div>
                <div class="shot">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-col">
                    <div class="item"><l class="t"></l><l></l><l class="s"></l></div>
                    <div class="item"><l class="t2"></l><l></l></div>
                  </div>
                </div>
                <div class="shot-caption"><b>읽기 중심</b></div>
              </div>
              <div>
                <div class="shot">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-row"><div class="cells"><u></u><u></u><u></u><u></u><u></u><u></u></div></div>
                </div>
                <div class="shot-caption"><b>그리드</b></div>
              </div>
              <div>
                <div class="shot dark">
                  <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
                  <div class="shot-col">
                    <div class="rowline"><i></i><l class="t"></l></div>
                    <div class="rowline"><i></i><l class="t2"></l></div>
                    <div class="rowline"><i></i><l class="t"></l></div>
                  </div>
                </div>
                <div class="shot-caption"><b>작업 로그</b></div>
              </div>
            </div>

            <div class="eyebrow" style="margin:32px 0 12px">흐름과 비용</div>
            <div class="flow">
              <div class="now"><div class="num">1</div><div class="what">키 등록</div><div class="cost">완료</div></div>
              <div><div class="num">2</div><div class="what">컨셉 4안</div><div class="cost">호출 1회</div></div>
              <div><div class="num">3</div><div class="what">세부 정하기</div><div class="cost">무료</div></div>
              <div><div class="num">4</div><div class="what">대화로 작업</div><div class="cost">지시마다</div></div>
              <div><div class="num">5</div><div class="what">ZIP 내려받기</div><div class="cost">무료</div></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </figure>

  <!-- =================== 상태 2·5 =================== -->
  <div class="spec-cols two">

    <figure class="spec-state">
      <figcaption><b>상태 2</b> 확인 중</figcaption>
      <div class="spec-frame">
        <div class="chatpane" style="border-right:0">
          <div class="chat-body">
            <div class="msg user">
              <div class="msg-role">나</div>
              <div class="msg-body"><span class="token">sk-ant- ... 4f2a</span></div>
            </div>
            <div class="msg">
              <div class="msg-role">안내</div>
              <div class="msg-body">

                  <div class="field">
                    <div class="field-label">API 키</div>

                      <input type="password" class="mono bad" style="flex:1 1 140px; min-width:0" placeholder="sk-ant-">

            <div class="msg sys">
              <div class="msg-body">
                <span class="strong">다른 두 경우</span>

                  <li>제공자에 닿지 못했습니다 - 네트워크 문제로 보입니다. 확장 프로그램이 요청을 막는 경우도 있습니다</li>
                  <li>키 형식이 다릅니다 - Anthropic 키는 <span class="token">sk-ant-</span> 로 시작합니다. 호출 전에 걸러내므로 비용이 들지 않습니다</li>

            </div>
          </div>

  <!-- =================== 상태 7. 모바일 =================== -->
  <figure class="spec-state">
    <figcaption><b>상태 7</b> 모바일 360 - 대화가 전체 폭, 화면은 탭으로 전환</figcaption>
    <div class="spec-frame narrow">
      <div class="chatshell">
        <div class="chatpane" style="border-right:0">
          <div class="chat-head">
            <span class="mark">T</span>
            <span class="name">스킨 만들기</span>
            <span class="spacer"></span>
            <span class="badge">1 / 5</span>
          </div>
          <div class="tabs" style="padding:0 16px">
            <button class="tab on">대화</button>
            <button class="tab">나오는 것</button>
          </div>
          <div class="chat-body">
            <div class="msg sys">
              <div class="msg-body">서버 없음 · 키는 이 브라우저를 벗어나 고른 제공자로만 갑니다.</div>
