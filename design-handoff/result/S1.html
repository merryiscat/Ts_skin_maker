<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S1 설정</title>
<link rel="stylesheet" href="./design.css">
</head>
<body>

<div class="spec">

  <div class="spec-head">
    <div class="eyebrow">S1</div>
    <h1>설정</h1>
    <p>작업 화면을 떠나지 않는다. 대화 자리를 설정이 잠시 덮고, 오른쪽 미리보기는 흐리게 남아 무엇을 만들던 중이었는지 잊지 않는다.</p>
    <nav class="spec-nav">
      <a href="./E1.html">E1 키 등록</a>
      <a href="./P1.html">P1 컨셉</a>
      <a href="./P2.html">P2 세부</a>
      <a href="./W1.html">W1 작업</a>
      <a href="./D1.html">D1 내려받기</a>
      <a href="./S1.html" class="on">S1 설정</a>
      <a href="./palettes.html">팔레트</a>
    </nav>
    <div class="themebar"></div>
  </div>

  <!-- ===================================================================
       상태 1. 기본
       구조 변경: 와이어는 오른쪽에 겹치는 패널이었다. 이 골격에서는 오른쪽이
       미리보기 자리이므로 설정을 왼쪽 대화 자리에 덮는다. 미리보기를 가리지
       않는 편이 "무엇을 만들던 중이었나"를 더 잘 남긴다.
       =================================================================== -->
  <figure class="spec-state">
    <figcaption><b>상태 1</b> 기본 - 대화 자리를 설정이 덮는다</figcaption>
    <div class="spec-frame">
      <div class="chatshell overlay">

        <div class="drawer" style="display:flex; flex-direction:column">
          <div class="panel-head">설정 <span class="spacer"></span><button class="sm ghost">닫기</button></div>
          <div class="chat-body">

            <div class="field">
              <div class="field-label">모델</div>
              <div class="card tight">
                <div class="card-title" style="font-size:var(--t-body)">Claude Opus 5</div>
                <div class="card-sub">대화 한 번 <span class="token">{비용}</span></div>
              </div>
              <button class="sm" style="margin-top:8px">바꾸기</button>
            </div>

            <div class="field">
              <div class="field-label">이번 작업</div>
              <ul class="list rows small">
                <li><span class="spacer">시작점</span><span class="strong">보편 A</span></li>
                <li><span class="spacer">대화</span><span class="strong"><span class="token">{횟수}</span> 회</span></li>
                <li><span class="spacer">토큰</span><span class="strong"><span class="token">{토큰}</span></span></li>
                <li><span class="spacer">비용</span><span class="strong"><span class="token">{비용}</span></span></li>
              </ul>
            </div>

            <div class="field">
              <div class="field-label">키</div>
              <div class="row">
                <span class="badge ok">Anthropic</span>
                <span class="token">... 4f2a</span>
              </div>
              <button class="sm" style="margin-top:8px">키 관리</button>
            </div>

            <hr class="rule">

            <div class="field">
              <div class="field-label">작업이 사라지는 것</div>
              <div class="col">
                <button class="sm">대화 처음부터</button>
                <button class="sm">시작점 다시 고르기</button>
              </div>
              <div class="field-note">앞은 비용이 들지 않고, 뒤는 4안을 다시 만들어 비용이 듭니다</div>
            </div>

          </div>
        </div>

        <div class="canvas behind">
          <div class="canvas-head"><span class="badge">미리보기</span><span class="spacer"></span><span>보편 A</span></div>
          <div class="canvas-body">
            <div class="shot lg" style="aspect-ratio:16/10">
              <div class="shot-bar"><i class="w"></i><u></u><b></b></div>
              <div class="shot-row">
                <div class="shot-col">
                  <div class="item"><l class="t"></l><l></l><l class="s"></l></div>
                  <div class="item"><l class="t2"></l><l></l></div>
                  <div class="item"><l class="t"></l><l></l></div>
                </div>
                <div class="shot-side"><div class="avatar"></div><l class="xs"></l><l class="s"></l><l class="s"></l></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
    <p class="spec-note">와이어와 달라진 점: 겹치는 자리를 오른쪽에서 왼쪽으로 옮겼다. 이 골격에서 오른쪽은 결과를 보는 자리이므로 그쪽을 가리면 맥락이 끊긴다. 구분선 아래가 되돌릴 수 없는 구역이다.</p>
  </figure>

  <!-- =================== 상태 2·3 =================== -->
  <div class="spec-cols two">

    <figure class="spec-state">
      <figcaption><b>상태 2</b> 모델 바꾸기 - 패널 안에서 펼침</figcaption>
      <div class="spec-frame">
        <div class="drawer">
          <div class="panel-head">모델 <span class="spacer"></span><button class="sm ghost">뒤로</button></div>
          <div class="chat-body">
            <div class="eyebrow" style="margin-bottom:8px">추천</div>
            <div class="card tight selected">
              <div class="card-title" style="font-size:var(--t-body)">Claude Opus 5</div>
              <div class="card-sub">대화 <span class="token">{비용}</span> · 가장 정확</div>
            </div>
            <div class="card tight">
              <div class="card-title" style="font-size:var(--t-body)">Claude Sonnet 5</div>
              <div class="card-sub">대화 <span class="token">{비용}</span> · 더 싸고 빠름</div>
            </div>
            <div class="col" style="margin-top:16px">
              <button class="sm">받아온 목록에서</button>
              <button class="sm">직접 입력</button>
            </div>
            <div class="card dashed tight" style="margin-top:16px">
              <p class="tiny dim">바꿔도 지금까지의 대화는 그대로입니다. 다음 지시부터 새 모델이 씁니다.</p>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <figure class="spec-state">
      <figcaption><b>상태 3</b> 되돌릴 수 없는 것 - 먼저 내려받기를 첫 선택지로</figcaption>
      <div class="spec-frame">
        <div class="drawer">
          <div class="panel-head">시작점 다시 고르기</div>
          <div class="chat-body">
            <div class="note bad">
              <h3>지금까지의 작업이 사라집니다</h3>
              <ul class="list marked small" style="margin-top:8px">
                <li>대화 <span class="token">{횟수}</span> 회</li>
                <li>지금 미리보기에 보이는 스킨</li>
              </ul>
              <span class="tiny">4안을 다시 만드는 데 <span class="token">{비용}</span> 정도가 듭니다. 지금 스킨을 남기려면 먼저 내려받으세요.</span>
            </div>
            <div class="col" style="margin-top:16px">
              <button class="sm primary block">먼저 내려받기</button>
              <button class="sm block">그래도 다시 고르기</button>
              <button class="sm ghost block">취소</button>
            </div>
          </div>
        </div>
      </div>
    </figure>

  </div>

  <div class="spec-cols two">

    <figure class="spec-state">
      <figcaption><b>상태 4</b> 키 관리 - 좁은 패널에서 하지 않고 E1 으로 보낸다</figcaption>
      <div class="spec-frame">
        <div class="drawer">
          <div class="panel-head">키</div>
          <div class="chat-body">
            <div class="card tight">
              <div class="row">
                <span class="badge ok">Anthropic</span>
                <span class="token">... 4f2a</span>
              </div>
              <div class="field-note">이 브라우저에 저장됨</div>
            </div>
            <div class="col" style="margin-top:12px">
              <button class="sm">다시 확인</button>
              <button class="sm danger">저장된 키 지우기</button>
            </div>
            <div class="card dashed tight" style="margin-top:16px">
              <p class="tiny dim">키를 바꾸거나 제공자를 옮기려면 등록 화면으로 갑니다. 하던 작업은 그대로 남습니다.</p>
              <button class="sm" style="margin-top:10px">키 등록 화면으로</button>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <figure class="spec-state">
      <figcaption><b>상태 5</b> 모바일 360 - 패널이 화면 전체를 덮는다</figcaption>
      <div class="spec-frame narrow">
        <div class="drawer">
          <div class="chat-head">
            <span class="mark">T</span><span class="name">설정</span>
            <span class="spacer"></span>
            <button class="sm">닫기</button>
          </div>
          <div class="chat-body">
            <div class="field">
              <div class="field-label">모델</div>
              <div class="card tight">
                <div class="card-title" style="font-size:var(--t-body)">Claude Opus 5</div>
                <div class="card-sub">대화 한 번 <span class="token">{비용}</span></div>
              </div>
              <button class="sm" style="margin-top:8px">바꾸기</button>
            </div>
            <div class="field">
              <div class="field-label">이번 작업</div>
              <ul class="list rows small">
                <li><span class="spacer">대화</span><span class="strong"><span class="token">{횟수}</span> 회</span></li>
                <li><span class="spacer">비용</span><span class="strong"><span class="token">{비용}</span></span></li>
              </ul>
            </div>
            <div class="field">
              <div class="field-label">키</div>
              <button class="sm">키 관리</button>
            </div>
            <hr class="rule" style="margin:16px 0">
            <div class="field">
              <div class="field-label">작업이 사라지는 것</div>
              <div class="col">
                <button class="sm">대화 처음부터</button>
                <button class="sm">시작점 다시 고르기</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </figure>

  </div>

</div>

<script src="./theme.js"></script>
</body>
</html>
